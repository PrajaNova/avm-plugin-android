[package]
name = "avm-plugin-android"
version = "0.2.8"
edition = "2021"
description = "avm native provider for the Android SDK (cmdline-tools, platform-tools, sdkmanager). Speaks avm's plugin protocol (https://github.com/PrajaNova/avm)."
license = "MIT"
repository = "https://github.com/PrajaNova/avm-plugin-android"

[dependencies]
avm-plugin-api = { git = "https://github.com/PrajaNova/avm" }
anyhow = "1.0"
serde_json = "1.0"
wait-timeout = "0.2"
